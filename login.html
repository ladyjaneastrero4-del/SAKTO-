  <header class="site-header"><a class="brand-link" href="index.html">🌿 SAKTO</a><button type="button" class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button><nav id="siteNav" aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="dashboard.html">Dashboard</a><a href="budget.html">Budget</a><a href="savings.html">Savings</a><a href="local-discovery.html">Discover</a><a href="favorites.html">Favorites</a><a href="contact.html">Contact</a></nav></header>

  <div role="main" class="container">
    <div class="logo">
      <p class="brand-name">SAKTO</p>
      <p>Student Budget & Local Discovery</p>
    </div>

    <div class="form-box">
      <h1>Welcome Back!</h1>
      <p>Log in to your SAKTO account</p>

      <form id="loginForm">
        <label>Username</label>
        <input type="text" placeholder="Enter your username" required>

        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>

        <p class="form-error" id="formError" role="alert"></p>
        <button type="submit">Log In</button>
      </form>

      <p class="switch">
        Don't have an account?
        <a href="register.html">Register</a>
      </p>
    </div>
  </div>
<footer class="site-footer"><p>© 2026 SAKTO · Tarlac State University, College of Computer Studies · Web Development Final Project</p></footer>
